<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Nauman Hanif, Computer Science student. Code that cooks.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="260" rx="16" fill="url(#bg)"/>

  <!-- subtle dot texture -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="620" cy="30" r="3"/><circle cx="660" cy="60" r="2"/><circle cx="700" cy="25" r="3"/>
    <circle cx="640" cy="230" r="3"/><circle cx="690" cy="205" r="2"/><circle cx="600" cy="190" r="2"/>
    <circle cx="980" cy="40" r="3"/><circle cx="975" cy="225" r="3"/><circle cx="30" cy="235" r="2"/>
  </g>

  <!-- text block -->
  <text x="60" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Nauman Hanif</text>
  <rect x="60" y="128" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="60" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#cbd5e1">Computer Science · University of Bedfordshire</text>
  <text x="60" y="210" font-family="Consolas, Menlo, monospace" font-size="19" fill="#fb923c">const mission = "code that cooks";</text>

  <!-- fork -->
  <g fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M713 62 V92 Q713 106 725 106 Q737 106 737 92 V62"/>
    <path d="M725 62 V106"/>
    <path d="M725 106 V196"/>
  </g>

  <!-- plate with code symbol -->
  <circle cx="840" cy="130" r="82" fill="none" stroke="#fb923c" stroke-width="6"/>
  <circle cx="840" cy="130" r="63" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text x="840" y="146" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="46" font-weight="700" fill="#5eead4">&lt;/&gt;</text>

  <!-- spoon -->
  <g fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round">
    <ellipse cx="955" cy="88" rx="15" ry="26"/>
    <path d="M955 114 V196"/>
  </g>
</svg>
